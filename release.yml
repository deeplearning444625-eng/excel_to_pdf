name: Build and release excel2pdf.exe

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.1.0 && git push origin v1.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build single exe
        run: >
          pyinstaller --onefile --name excel2pdf
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes
          --exclude-module numpy --exclude-module pandas --exclude-module matplotlib
          excel_to_pdf.py
      - name: Checksum
        shell: pwsh
        run: Get-FileHash dist\excel2pdf.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  excel2pdf.exe" } | Out-File dist\excel2pdf.exe.sha256 -Encoding ascii
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/excel2pdf.exe
            dist/excel2pdf.exe.sha256
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: excel2pdf-exe
          path: dist/excel2pdf.exe
