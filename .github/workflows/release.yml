name: Build and release excel2pdf

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.3.0 && git push origin v1.3.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller openpyxl
      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Build single exe (local app, opens in the browser)
        run: >
          pyinstaller --onefile --windowed --name excel2pdf
          --hidden-import win32com.client --hidden-import pythoncom
          --hidden-import pywintypes --hidden-import win32process
          --exclude-module numpy --exclude-module pandas --exclude-module matplotlib
          --exclude-module openpyxl --exclude-module tkinter
          excel_to_pdf.py
      - name: Build fast-start folder version
        run: >
          pyinstaller --onedir --windowed --name excel2pdf-fast
          --hidden-import win32com.client --hidden-import pythoncom
          --hidden-import pywintypes --hidden-import win32process
          --exclude-module numpy --exclude-module pandas --exclude-module matplotlib
          --exclude-module openpyxl --exclude-module tkinter
          excel_to_pdf.py
      - name: Zip folder version and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\excel2pdf-fast\* -DestinationPath dist\excel2pdf-fast-start.zip
          Get-FileHash dist\excel2pdf.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  excel2pdf.exe" } | Out-File dist\excel2pdf.exe.sha256 -Encoding ascii
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/excel2pdf.exe
            dist/excel2pdf.exe.sha256
            dist/excel2pdf-fast-start.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: excel2pdf
          path: |
            dist/excel2pdf.exe
            dist/excel2pdf-fast-start.zip
